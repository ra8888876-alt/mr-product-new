<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>MR PRODUCT — Admin Login</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: #101010;
      color: #f5f0e6;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .admin-box {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid #b99a55;
      border-radius: 14px;
      background: #191919;
    }

    .admin-box h1 {
      margin-bottom: 8px;
    }

    .admin-box label {
      display: block;
      margin-top: 18px;
    }

    .admin-box input {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 7px;
      background: #101010;
      color: white;
    }

    .admin-box button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .gold {
      color: #d8b66b;
    }
  </style>
</head>

<body>

  <main class="admin-box">
    <p class="gold">MR PRODUCT</p>
    <h1>Admin Login</h1>
    <p>Authorized administrators only.</p>

    <form id="login-form">
      <label>
        Email
        <input
          type="email"
          id="email"
          autocomplete="username"
          required
        >
      </label>

      <label>
        Password
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
        >
      </label>

      <button type="submit" class="gold-button">
        Login
      </button>
    </form>

    <div id="message" role="status"></div>

    <button
      id="logout"
      type="button"
      hidden
    >
      Logout
    </button>

    <p style="margin-top:24px">
      <a href="index.html">← Back to Store</a>
    </p>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const config = window.MR_PRODUCT_CONFIG || {};

    const client = window.supabase.createClient(
      config.supabaseUrl,
      config.publishableKey
    );

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const logoutButton = document.getElementById("logout");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Checking login...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "Login failed. Check your email and password.";
        return;
      }

      const { data: admin, error: adminError } = await client
        .from("admin_users")
        .select("user_id, role, is_active")
        .eq("user_id", data.user.id)
        .eq("is_active", true)
        .maybeSingle();

      if (adminError || !admin || admin.role !== "admin") {
        await client.auth.signOut();
        message.textContent = "Access denied. This account is not an active admin.";
        return;
      }

      form.hidden = true;
      logoutButton.hidden = false;

      message.textContent = "Admin login verified. Admin dashboard features are not enabled yet.";
    });

    logoutButton.addEventListener("click", async () => {
      await client.auth.signOut();
      form.hidden = false;
      logoutButton.hidden = true;
      message.textContent = "You have logged out.";
    });

    client.auth.getSession().then(async ({ data }) => {
      if (data.session) {
        await client.auth.signOut();
      }
    });
  </script>

</body>
</html>
