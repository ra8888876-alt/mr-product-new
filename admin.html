<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR PRODUCT — Coupon Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#eee;font-family:Arial,sans-serif}
header{padding:20px;background:#181818;border-bottom:1px solid #c6a34b}
h1,h2{color:#d6b45b}
main{max-width:1100px;margin:auto;padding:18px}
.card{background:#1d1d1d;padding:18px;border:1px solid #393126;border-radius:12px;margin:15px 0}
input,select{width:100%;padding:12px;margin:7px 0;background:#292929;color:white;border:1px solid #555;border-radius:6px}
label{display:block;margin-top:12px;color:#d6b45b}
button{background:#c6a34b;color:#111;border:0;padding:11px 15px;border-radius:6px;margin:4px;cursor:pointer}
.danger{background:#a83232;color:white}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #444}
.muted{color:#aaa}
.status{color:#d6b45b}
</style>
</head>

<body>
<header>
<h1>MR PRODUCT</h1>
<p>Coupon Management</p>
</header>

<main>
<div class="card" id="loading">Checking admin access...</div>

<div class="card" id="login" hidden>
<h2>Admin Login Required</h2>
<p>Please login from your main Admin Panel first.</p>
<button onclick="location.href='admin.html'">Go to Admin Login</button>
</div>

<div id="dashboard" hidden>

<div class="card">
<button onclick="location.href='admin.html'">Back to Admin</button>
<button onclick="loadCoupons()">Refresh Coupons</button>
<button onclick="logout()">Logout</button>
<p id="message" class="muted"></p>
</div>

<div class="card">
<h2>Create New Coupon</h2>

<label>Coupon Code</label>
<input id="code" maxlength="40" placeholder="WELCOME10">

<label>Discount Type</label>
<select id="type">
<option value="percentage">Percentage (%)</option>
<option value="fixed">Fixed Amount (৳)</option>
</select>

<label>Discount Value</label>
<input id="value" type="number" min="0.01" step="0.01" placeholder="10">

<label>Minimum Order Amount (৳)</label>
<input id="minimum" type="number" min="0" value="0">

<label>Maximum Discount (৳) — Optional</label>
<input id="maximum" type="number" min="0.01" placeholder="Leave empty for no limit">

<label>Usage Limit — Optional</label>
<input id="limit" type="number" min="1" step="1" placeholder="Leave empty for unlimited">

<label>Start Date — Optional</label>
<input id="starts" type="datetime-local">

<label>Expiry Date — Optional</label>
<input id="expires" type="datetime-local">

<button id="createButton" onclick="createCoupon()">Create Coupon</button>
</div>

<div class="card">
<h2>All Coupons</h2>
<div class="table-wrap" id="couponList">Loading...</div>
</div>

</div>
</main>

<script>
const cfg=window.MR_PRODUCT_CONFIG;

const db=window.supabase.createClient(
  cfg.supabaseUrl,
  cfg.publishableKey
);

const $=id=>document.getElementById(id);

function money(v){
  return "৳"+Number(v||0).toLocaleString("en-BD");
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

async function api(method,body){
  const {data,error}=await db.functions.invoke("admin-coupons",{
    method,
    ...(body?{body}:{})
  });

  if(error)throw error;
  if(data?.error)throw new Error(data.error);
  return data;
}

async function checkAdmin(){
  try{
    const {data:{session}}=await db.auth.getSession();

    if(!session){
      $("loading").hidden=true;
      $("login").hidden=false;
      return;
    }

    const {data,error}=await db.from("admin_users")
      .select("user_id")
      .eq("user_id",session.user.id)
      .eq("is_active",true)
      .maybeSingle();

    if(error||!data){
      $("loading").hidden=true;
      $("login").hidden=false;
      return;
    }

    $("loading").hidden=true;
    $("dashboard").hidden=false;
    await loadCoupons();

  }catch(e){
    $("loading").textContent="Access check failed: "+e.message;
  }
}

async function logout(){
  await db.auth.signOut();
  location.href="admin.html";
}

async function createCoupon(){
  const button=$("createButton");

  const payload={
    code:$("code").value.trim().toUpperCase(),
    discount_type:$("type").value,
    discount_value:Number($("value").value),
    min_order_amount:Number($("minimum").value||0),
    max_discount_amount:$("maximum").value||null,
    usage_limit:$("limit").value||null,
    starts_at:$("starts").value
      ? new Date($("starts").value).toISOString():null,
    expires_at:$("expires").value
      ? new Date($("expires").value).toISOString():null,
    is_active:true
  };

  if(!payload.code||!payload.discount_value){
    $("message").textContent="Enter coupon code and discount value.";
    return;
  }

  if(payload.expires_at&&payload.starts_at&&
     new Date(payload.expires_at)<=new Date(payload.starts_at)){
    $("message").textContent="Expiry must be after start date.";
    return;
  }

  button.disabled=true;
  button.textContent="Creating...";

  try{
    await api("POST",payload);

    $("message").textContent="Coupon created successfully!";

    ["code","value","maximum","limit","starts","expires"]
      .forEach(id=>$(id).value="");

    $("minimum").value="0";

    await loadCoupons();

  }catch(e){
    $("message").textContent="Create failed: "+e.message;
  }finally{
    button.disabled=false;
    button.textContent="Create Coupon";
  }
}

async function toggleCoupon(id,active){
  try{
    await api("PATCH",{id,is_active:!active});
    $("message").textContent="Coupon status updated.";
    await loadCoupons();
  }catch(e){
    $("message").textContent="Update failed: "+e.message;
  }
}

async function deleteCoupon(id){
  if(!confirm("Permanently delete this coupon?"))return;

  try{
    await api("DELETE",{id});
    $("message").textContent="Coupon deleted.";
    await loadCoupons();
  }catch(e){
    $("message").textContent="Delete failed: "+e.message;
  }
}

async function loadCoupons(){
  $("couponList").textContent="Loading coupons...";

  try{
    const result=await api("GET");
    const coupons=result.coupons||[];

    if(!coupons.length){
      $("couponList").textContent="No coupons created yet.";
      return;
    }

    let html=`<table>
    <tr>
      <th>Code</th>
      <th>Discount</th>
      <th>Minimum Order</th>
      <th>Usage</th>
      <th>Expiry</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>`;

    coupons.forEach(c=>{
      const discount=c.discount_type==="percentage"
        ? Number(c.discount_value)+"%"
        : money(c.discount_value);

      const usage=c.usage_limit
        ? c.used_count+"/"+c.usage_limit
        : c.used_count+"/Unlimited";

      html+=`<tr>
        <td><b>${esc(c.code)}</b></td>
        <td>${discount}</td>
        <td>${money(c.min_order_amount)}</td>
        <td>${esc(usage)}</td>
        <td>${c.expires_at?esc(new Date(c.expires_at).toLocaleString()):"No expiry"}</td>
        <td class="status">${c.is_active?"Active":"Inactive"}</td>
        <td>
          <button data-toggle="${esc(c.id)}" data-active="${c.is_active}">
            ${c.is_active?"Deactivate":"Activate"}
          </button>
          <button class="danger" data-delete="${esc(c.id)}">Delete</button>
        </td>
      </tr>`;
    });

    $("couponList").innerHTML=html+"</table>";

    $("couponList").querySelectorAll("[data-toggle]").forEach(b=>{
      b.addEventListener("click",()=>{
        toggleCoupon(b.dataset.toggle,b.dataset.active==="true");
      });
    });

    $("couponList").querySelectorAll("[data-delete]").forEach(b=>{
      b.addEventListener("click",()=>{
        deleteCoupon(b.dataset.delete);
      });
    });

  }catch(e){
    $("couponList").textContent="Could not load coupons: "+e.message;
  }
}

checkAdmin();
</script>
</body>
</html>
